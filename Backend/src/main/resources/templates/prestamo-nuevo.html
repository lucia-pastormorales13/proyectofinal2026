<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Loan - Bumeran Préstamos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <style>
        .radio-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .radio-group label { display: flex; align-items: center; gap: 0.5rem; font-weight: 400; cursor: pointer; }
        .radio-group input[type="radio"] { width: auto; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 500px; margin-top: 2rem;">
        <div class="nav" style="margin-bottom: 2rem;">
            <a href="/prestamos" class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.8rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.25rem;"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Back
            </a>
        </div>
        <div class="card">
            <h1 style="font-size: 1.25rem; margin-bottom: 0.25rem;">New Loan</h1>
            <p style="font-size: 0.875rem; color: var(--muted-foreground); margin-bottom: 1.5rem;">Select item and borrower</p>

            <div th:if="${error}" style="padding: 0.75rem; background: #fee2e2; color: #991b1b; border-radius: var(--radius); margin-bottom: 1rem;" th:text="${error}"></div>

            <form th:action="@{/prestamos/nuevo}" method="post">
                <div class="form-group">
                    <label for="articulo">Item</label>
                    <select id="articulo" name="articuloId" required>
                        <option value="" disabled selected>Select item</option>
                        <option th:each="a : ${articulosDisponibles}" th:value="${a.id}" th:text="${a.nombre}"></option>
                        <option th:if="${#lists.isEmpty(articulosDisponibles)}" value="" disabled>There are no articles</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Lend to:</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="tipoPrestatario" value="usuario" checked onchange="toggleBorrowerType()" />
                            Registered User
                        </label>
                        <label>
                            <input type="radio" name="tipoPrestatario" value="nombre" onchange="toggleBorrowerType()" />
                            Manual Name
                        </label>
                    </div>
                </div>

                <div class="form-group" id="usuarioGroup">
                    <label>User</label>
                    <select name="usuarioReceptorId" id="usuarioReceptorId" required>
                        <option value="" disabled selected>Select user</option>
                        <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre + ' (' + u.email + ')'}"></option>
                    </select>
                </div>

                <div class="form-group" id="nombreGroup" style="display: none;">
                    <label>Name</label>
                    <input type="text" name="nombreReceptor" id="nombreReceptor" placeholder="Ej: Juan" />
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.75rem; padding-top: 1rem;">
                    <a href="/prestamos" class="btn btn-secondary" style="text-decoration: none;">Cancel</a>
                    <button type="submit">Create Loan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleBorrowerType() {
            const isUser = document.querySelector('input[name="tipoPrestatario"]:checked').value === 'usuario';
            document.getElementById('usuarioGroup').style.display = isUser ? 'block' : 'none';
            document.getElementById('nombreGroup').style.display = isUser ? 'none' : 'block';
            document.getElementById('usuarioReceptorId').required = isUser;
            document.getElementById('nombreReceptor').required = !isUser;
        }
    </script>
</body>
</html>
