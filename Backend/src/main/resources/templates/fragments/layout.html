<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Bumeran Préstamos'">Bumeran Préstamos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <div th:fragment="header">
        <div class="container">
            <div class="nav">
                <img th:src="@{/images/Logo.png}" alt="Bumeran" height="32" style="margin-right: 0.5rem;" />
                <h1 style="font-size: 1.25rem; margin-right: 2rem;">Bumeran</h1>
                <a th:classappend="${#httpServletRequest.requestURI == '/dashboard' or #httpServletRequest.requestURI == '/'} ? 'active' : ''" th:href="@{/dashboard}">My Items</a>
                <a th:classappend="${#httpServletRequest.requestURI == '/prestamos'} ? 'active' : ''" th:href="@{/prestamos}">Loans</a>
                <span style="margin-left: auto; font-size: 0.875rem; color: var(--muted-foreground);">
                    Welcome to Bumeran!
                </span>
                <a th:href="@{/logout}" class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.8rem;">Logout</a>
            </div>
        </div>
    </div>

    <div th:fragment="main">
        <div class="container">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:replace="${view}"></div>
        </div>
    </div>
</body>
</html>
