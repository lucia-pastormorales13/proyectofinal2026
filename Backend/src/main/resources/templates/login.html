<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bumeran Préstamos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card" style="width: 100%; max-width: 400px;">
            <div style="text-align: center; margin-bottom: 0.5rem;">
                <img th:src="@{/images/Logotexto.png}" alt="Bumeran" style="max-height: 120px; object-fit: contain;" />
            </div>
            <h1 style="text-align: center; font-size: 1.5rem; margin-bottom: 0.25rem;">Login to Your Account</h1>
            <p style="text-align: center; font-size: 0.875rem; color: var(--muted-foreground); margin-bottom: 1.5rem;">
                Enter your credentials to access the platform
            </p>
            <form th:action="@{/login}" method="post">
                <div th:if="${param.error}" style="color: var(--destructive); font-size: 0.875rem; margin-bottom: 1rem; text-align: center;">
                    Credenciales incorrectas
                </div>
                <div th:if="${param.logout}" style="color: var(--muted-foreground); font-size: 0.875rem; margin-bottom: 1rem; text-align: center;">
                    Has cerrado sesión
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="username" placeholder="tu@email.com" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required />
                </div>
                <button type="submit" style="width: 100%;">Login</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--muted-foreground);">
                Don't have an account?
                <a th:href="@{/register}" style="color: #2563eb;">Register here</a>
            </p>
        </div>
    </div>
</body>
</html>
