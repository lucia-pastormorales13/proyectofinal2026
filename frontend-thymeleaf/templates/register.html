<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bumeran Préstamos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="card" style="width: 100%; max-width: 400px;">
            <div style="text-align: center; margin-bottom: 0.5rem;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; border-radius: 9999px; background: var(--primary); color: white; margin-bottom: 0.5rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4 7.55 4.24a1 1 0 0 0-1.1 0L2 6.5"/><path d="M21.16 8.2 12 13.2l-1.5-.9"/><path d="M21 11.5v5.5a1 1 0 0 1-.5.86l-5.5 3.2a1 1 0 0 1-1 0l-10-5.8A1 1 0 0 1 3 13.5V8.5"/><path d="m3 14.5 5.5 3.2a1 1 0 0 0 1 0l3.5-2"/></svg>
                </div>
            </div>
            <h1 style="text-align: center; font-size: 1.5rem; margin-bottom: 0.25rem;">Crear Cuenta</h1>
            <p style="text-align: center; font-size: 0.875rem; color: var(--muted-foreground); margin-bottom: 1.5rem;">
                Regístrate para empezar a gestionar tus artículos
            </p>
            <form th:action="@{/register}" method="post">
                <div th:if="${error}" style="color: var(--destructive); font-size: 0.875rem; margin-bottom: 1rem; text-align: center;" th:text="${error}"></div>
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Carlos López" required />
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required />
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" />
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required minlength="6" />
                </div>
                <button type="submit" style="width: 100%;">Registrar Cuenta</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--muted-foreground);">
                ¿Ya tienes cuenta?
                <a th:href="@{/login}" style="color: #2563eb;">Inicia sesión</a>
            </p>
        </div>
    </div>
</body>
</html>
